name: Tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: python -c "from lupa.lua51 import LuaRuntime; LuaRuntime()"
      - run: python -m unittest discover -s ForeverLedger-tools/tests -v
      - run: python scripts/package.py
